name: CodeDeck CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: sqlite://
      OPENAI_API_KEY: ""
      GROQ_API_KEY: ""
      GROK_API_KEY: ""
      XAI_API_KEY: ""
      LANGFUSE_PUBLIC_KEY: ""
      LANGFUSE_SECRET_KEY: ""
      SEMANTIC_EMBEDDINGS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile backend modules
        run: python -m compileall -q app
      - name: Run backend tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Build production frontend
        run: npm run build

  configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install YAML parser
        run: python -m pip install PyYAML==6.0.3
      - name: Validate Compose and monitoring configuration
        run: |
          cp .env.example .env
          docker compose config -q
          python - <<'PY'
          import json
          import pathlib
          import yaml
          json.loads(pathlib.Path('monitoring/grafana/dashboards/codedeck-overview.json').read_text())
          yaml.safe_load(pathlib.Path('monitoring/prometheus.yml').read_text())
          for path in pathlib.Path('monitoring/grafana/provisioning').rglob('*.yml'):
              yaml.safe_load(path.read_text())
          for path in pathlib.Path('k8s').rglob('*.yaml'):
              list(yaml.safe_load_all(path.read_text()))
          print('Configuration files parsed successfully')
          PY
      - name: Report remote deployment configuration
        run: |
          echo "No remote staging cluster is configured in this workflow. CI validates and builds only; use scripts/stage-project.ps1 with a reachable local CodeDeck API and kind cluster."

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  images:
    needs: [backend, frontend, configuration, secret-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: codedeck/backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build frontend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: codedeck/frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
